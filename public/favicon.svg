<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0728" />
      <stop offset="100%" stop-color="#05020d" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#312e81" stroke-width="8"/>
  
  <!-- Outer Glow Ring -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="url(#brandGrad)" stroke-width="4" opacity="0.4"/>
  
  <!-- Audio Waveform Graphic -->
  <g transform="translate(116, 176)">
    <!-- Equalizer Bars -->
    <rect x="0" y="40" width="20" height="80" rx="10" fill="#818cf8" opacity="0.7"/>
    <rect x="36" y="10" width="20" height="140" rx="10" fill="#6366f1" />
    <rect x="72" y="60" width="20" height="40" rx="10" fill="#4f46e5" opacity="0.8"/>
    
    <!-- Stylized S-Flow Curve -->
    <path d="M 120 20 C 180 20, 200 60, 160 90 C 120 120, 140 160, 200 160" fill="none" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Subtitle Caption Badge -->
    <rect x="110" y="125" width="160" height="42" rx="12" fill="#09090b" stroke="#6366f1" stroke-width="4"/>
    <text x="190" y="152" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#22c55e" text-anchor="middle" letter-spacing="2">CC</text>
  </g>
</svg>
